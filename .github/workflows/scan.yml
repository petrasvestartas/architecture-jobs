name: Daily job scan
# Scans all Swiss architecture job sources in the cloud every morning,
# commits the updated database + website data, and deploys the site.
# (The deploy job is included here because pushes made with GITHUB_TOKEN
# do not trigger other workflows.)

on:
  schedule:
    - cron: "30 3 * * *"   # 05:30 Swiss summer time / 04:30 winter
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet python-jobspy
      - name: Run the scan
        env:
          JOBTRACKER_SITE_DIR: ${{ github.workspace }}/public
          PYTHONIOENCODING: utf-8
        run: python scraper.py --careers 50 --career-watch 200
        working-directory: jobtracker
      - name: Commit results
        run: |
          git config user.name "jobtracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily cloud scan $(date -u +%F)"
          git pull --rebase --autostash origin main || true
          git push

  deploy:
    needs: scan
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
