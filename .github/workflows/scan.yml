name: Job scan
# Hourly light scans (07:00-19:00 CH) deploy fresh data straight to Pages;
# the 05:30 full scan additionally probes company career pages and commits
# the database so history persists. Hours are capped to stay inside the
# 3000 free private-repo Actions minutes per month.

on:
  schedule:
    - cron: "30 3 * * *"    # full scan, 05:30 Swiss summer time
    - cron: "0 5-17 * * *"  # light scan every hour, 07:00-19:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet python-jobspy
      - name: Run the scan (full at 05:30, light otherwise)
        env:
          JOBTRACKER_SITE_DIR: ${{ github.workspace }}/public
          PYTHONIOENCODING: utf-8
        working-directory: jobtracker
        run: |
          if [ "${{ github.event.schedule }}" = "30 3 * * *" ]; then
            python scraper.py --careers 50 --career-watch 200
          else
            python scraper.py --career-watch 25
          fi
      - name: Persist database (full scan only)
        if: github.event.schedule == '30 3 * * *'
        run: |
          git config user.name "jobtracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || {
            git commit -m "Daily full scan $(date -u +%F)"
            git pull --rebase --autostash origin main || true
            git push
          }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: scan
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
