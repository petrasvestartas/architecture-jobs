name: Job scan
# Hourly light scans (07:00-19:00 CH) deploy fresh data straight to Pages;
# the 05:30 full scan additionally runs career discovery, the JS-only site
# probe and competition results. Every run uses the headless browser and
# commits the database.
# Every run announces new matching jobs as a GitHub issue + email.

on:
  schedule:
    - cron: "30 3 * * *"    # full scan, 05:30 Swiss summer time
    - cron: "0 5-17 * * *"  # light scan every hour, 07:00-19:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet python-jobspy playwright
      - name: Install headless browser
        # every run, not just the full scan: since scan-local.yml (the
        # self-hosted runner) was retired, this is the only scan that reads
        # career pages which build their job list in JavaScript
        run: python -m playwright install --with-deps chromium
      - name: Run the scan (full at 05:30, light otherwise)
        env:
          JOBTRACKER_SITE_DIR: ${{ github.workspace }}/public
          PYTHONIOENCODING: utf-8
          JS_WATCH: "1"
        working-directory: jobtracker
        run: |
          if [ "${{ github.event.schedule }}" = "30 3 * * *" ]; then
            # full: also Playwright-probe 80 sites with no detected career
            # page for JS-only ones and stamp offices mentioned in fresh
            # competition results
            python scraper.py --careers 150 --career-watch 300 --probe-js 80 --competitions
          else
            # same slice the local runner used to scan
            python scraper.py --careers 40 --career-watch 250
          fi
      - name: Profile company directory upkeep (full scan only)
        # refreshes the register firms from Zefix and probes up to 300
        # firms whose website / careers page is unknown or due a re-check
        if: github.event.schedule == '30 3 * * *'
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        working-directory: jobtracker
        run: python profile_directory.py --limit 300
      - name: Profile "not a fit" feedback (issues sent from profile.html)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
        working-directory: jobtracker
        run: python profile_feedback.py
      - name: Profile scan (robotics / timber / software / research)
        # separate pipeline: own output (public/profile.js), never touches
        # the architecture DB or data.js; a failure must not block the deploy
        continue-on-error: true
        env:
          JOBTRACKER_SITE_DIR: ${{ github.workspace }}/public
          PYTHONIOENCODING: utf-8
        working-directory: jobtracker
        run: python profile_jobs.py
      - name: Send daily e-mail digest (early-morning full scan only)
        if: github.event.schedule == '30 3 * * *'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PYTHONIOENCODING: utf-8
        working-directory: jobtracker
        run: python notify.py
      - name: Persist state
        run: |
          git config user.name "jobtracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit only real state (DB + e-mail state) — NEVER the regenerated
          # public/ files. Those deploy straight from the workspace artifact;
          # committing them raced with the local 30-min scan's push and caused
          # data.js merge conflicts (exit 128, deploy skipped).
          # The DB goes in on every run now that the local runner, which used
          # to commit it hourly, is retired.
          git add jobtracker/jobtracker.db jobtracker/notified.json
          # profile.js is the exception to "never public/": no other writer
          # touches it, and pages.yml deploys from the repo on every local
          # push, so an uncommitted copy would vanish from the site
          git add jobtracker/profile_state.json public/profile.js \
            jobtracker/profile_companies.json jobtracker/profile_found.json \
            jobtracker/profile_rejected.json 2>/dev/null || true
          git diff --cached --quiet && { echo "no state changes to persist"; exit 0; }
          git commit -m "Scan state $(date -u +'%F %H:%M')"
          for i in 1 2 3 4 5; do
            if git push; then echo "state pushed"; exit 0; fi
            echo "push rejected (attempt $i) — re-syncing with origin"
            git pull --rebase -X theirs --autostash origin main \
              || git rebase --abort 2>/dev/null || true
          done
          echo "persist: still could not push; a later scan will re-commit"
          exit 0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: scan
    # same group as pages.yml: the local scan's pushes and this workflow both
    # deploy Pages, and two overlapping deployments make GitHub return
    # "400 ... due to in progress deployment". Queue instead of colliding;
    # never cancel in progress (that strands the deployment server-side).
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
