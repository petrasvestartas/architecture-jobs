name: Job scan
# Hourly light scans (07:00-19:00 CH) deploy fresh data straight to Pages;
# the 05:30 full scan additionally probes company career pages (including a
# headless-browser pass for script-only pages) and commits the database.
# Every run announces new matching jobs as a GitHub issue + email.

on:
  schedule:
    - cron: "30 3 * * *"    # full scan, 05:30 Swiss summer time
    - cron: "0 5-17 * * *"  # light scan every hour, 07:00-19:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet python-jobspy
      - name: Install headless browser (full scan only)
        if: github.event.schedule == '30 3 * * *'
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Run the scan (full at 05:30, light otherwise)
        env:
          JOBTRACKER_SITE_DIR: ${{ github.workspace }}/public
          PYTHONIOENCODING: utf-8
          JS_WATCH: ${{ github.event.schedule == '30 3 * * *' && '1' || '' }}
        working-directory: jobtracker
        run: |
          if [ "${{ github.event.schedule }}" = "30 3 * * *" ]; then
            # full: also Playwright-probe 80 sites with no detected career
            # page for JS-only ones (chromium is installed for this run) and
            # stamp offices mentioned in fresh competition results
            python scraper.py --careers 150 --career-watch 300 --probe-js 80 --competitions
          else
            python scraper.py --career-watch 60
          fi
      - name: Send daily e-mail digest (early-morning full scan only)
        if: github.event.schedule == '30 3 * * *'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PYTHONIOENCODING: utf-8
        working-directory: jobtracker
        run: python notify.py
      - name: Persist state
        run: |
          git config user.name "jobtracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit only real state (DB + e-mail state) — NEVER the regenerated
          # public/ files. Those deploy straight from the workspace artifact;
          # committing them raced with the local 30-min scan's push and caused
          # data.js merge conflicts (exit 128, deploy skipped).
          if [ "${{ github.event.schedule }}" = "30 3 * * *" ]; then
            git add jobtracker/jobtracker.db jobtracker/notified.json
          else
            git add jobtracker/notified.json
          fi
          git diff --cached --quiet && { echo "no state changes to persist"; exit 0; }
          git commit -m "Scan state $(date -u +'%F %H:%M')"
          for i in 1 2 3 4 5; do
            if git push; then echo "state pushed"; exit 0; fi
            echo "push rejected (attempt $i) — re-syncing with origin"
            git pull --rebase -X theirs --autostash origin main \
              || git rebase --abort 2>/dev/null || true
          done
          echo "persist: still could not push; a later scan will re-commit"
          exit 0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: scan
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
