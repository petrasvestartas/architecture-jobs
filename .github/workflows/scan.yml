name: Job scan
# Hourly light scans (07:00-19:00 CH) deploy fresh data straight to Pages;
# the 05:30 full scan additionally probes company career pages (including a
# headless-browser pass for script-only pages) and commits the database.
# Every run announces new matching jobs as a GitHub issue + email.

on:
  schedule:
    - cron: "30 3 * * *"    # full scan, 05:30 Swiss summer time
    - cron: "0 5-17 * * *"  # light scan every hour, 07:00-19:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet python-jobspy
      - name: Install headless browser (full scan only)
        if: github.event.schedule == '30 3 * * *'
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Run the scan (full at 05:30, light otherwise)
        env:
          JOBTRACKER_SITE_DIR: ${{ github.workspace }}/public
          PYTHONIOENCODING: utf-8
          JS_WATCH: ${{ github.event.schedule == '30 3 * * *' && '1' || '' }}
        working-directory: jobtracker
        run: |
          if [ "${{ github.event.schedule }}" = "30 3 * * *" ]; then
            python scraper.py --careers 150 --career-watch 200
          else
            python scraper.py --career-watch 50
          fi
      - name: Send daily e-mail digest (early-morning full scan only)
        if: github.event.schedule == '30 3 * * *'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PYTHONIOENCODING: utf-8
        working-directory: jobtracker
        run: python notify.py
      - name: Persist state
        run: |
          git config user.name "jobtracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event.schedule }}" = "30 3 * * *" ]; then
            git add -A
          else
            git add jobtracker/notified.json
          fi
          git diff --cached --quiet || {
            git commit -m "Scan state $(date -u +'%F %H:%M')"
            git pull --rebase --autostash origin main || true
            git push
          }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: scan
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
