<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light dark">
<title>Beyond Architecture</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e2001a">
<style>
/* tokens copied from index.html so both pages read as one site */
:root{
  --bg:#f5f5f3; --panel:#ffffff; --line:#e5e5e0; --line2:#d8d8d2;
  --text:#17181a; --muted:#6e6f75; --faint:#9b9ca1;
  --accent:#e2001a; --accent-soft:rgba(226,0,26,.08);
  --ok:#15803d; --bad:#b91c1c;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#141518; --panel:#1d1f23; --line:#2b2e33; --line2:#383b41;
  --text:#e9e9e6; --muted:#9a9ba2; --faint:#6d6e75;
  --accent:#ff4553; --accent-soft:rgba(255,69,83,.12);
  --ok:#4ade80; --bad:#f87171;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14.5px;line-height:1.5;background:var(--bg);color:var(--text)}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line2);padding:6px 9px}
input:focus{outline:none;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0 8px}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto;flex-wrap:wrap}
.brand .mark{width:12px;height:12px;background:var(--accent);display:inline-block;align-self:center}
.brand h1{font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand .sub{font-size:12px;color:var(--muted)}
.back{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#themeBtn{width:34px;height:34px;border:1px solid var(--line2);font-size:15px;background:var(--panel)}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{padding:8px 14px 9px;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--text)}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs .tct{color:var(--faint);margin-left:2px;font-variant-numeric:tabular-nums}
nav.tabs button.on .tct{color:var(--accent)}
main{padding:18px 0 30px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters .grow{flex:1 1 200px;min-width:150px}
.filters label{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.filters input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.note{font-size:12.5px;color:var(--muted);margin-bottom:12px;max-width:820px}
ul.jobs{list-style:none;border-top:1px solid var(--line)}
ul.jobs li{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:9px 2px;border-bottom:1px solid var(--line)}
.jt{font-weight:600}
.jt a:hover{text-decoration:underline}
.jm{font-size:12.5px;color:var(--muted);grid-column:1}
.jm .co{color:var(--text)}
.jr{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);white-space:nowrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border:1px solid var(--line2);color:var(--muted)}
.tag.new{border-color:var(--accent);color:var(--accent)}
.applied{opacity:.55}
.apBtn{border:1px solid var(--line2);padding:2px 8px;font-size:11.5px;color:var(--muted);background:var(--panel)}
.apBtn.on{border-color:var(--ok);color:var(--ok)}
.empty{padding:30px 0;color:var(--muted)}
h2{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:30px 0 8px}
.watch{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.watch a{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--panel);padding:6px 10px;font-size:13px}
.watch .n{color:var(--muted);font-variant-numeric:tabular-nums}
.watch .bad{color:var(--bad)}
@media (max-width:600px){
  ul.jobs li{grid-template-columns:1fr}
  .jr{grid-row:auto;grid-column:1}
}
</style>
</head>
<body>
<script>
// same gate as index.html: on github.io, send visitors who have not entered
// the password there back to it
(function(){
  var ok=false;try{ok=localStorage.getItem("jobtracker_gate")==="1";}catch(e){}
  if(/\.github\.io$/.test(location.hostname)&&!ok)location.replace("index.html");
})();
</script>
<header class="top">
  <div class="wrap">
    <div class="hbar">
      <div class="brand"><span class="mark"></span><h1>Beyond Architecture</h1><span class="sub" id="lastScan"></span></div>
      <a class="back" href="index.html">&larr; Architecture jobs</a>
      <button id="themeBtn" title="Toggle dark / light" aria-label="Toggle theme">&#9681;</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap">
  <p class="note">Robotics, timber-industry, software/geometry and research roles matching the profile from the application letters. Kept separate from the architecture list: own scan, own data file.</p>
  <div class="filters">
    <input type="text" id="q" class="grow" placeholder="Search title, company, location&hellip;" aria-label="Search">
    <label><input type="checkbox" id="newOnly"> New (3 days)</label>
    <label><input type="checkbox" id="weak"> Show weak matches</label>
    <label><input type="checkbox" id="hideApplied"> Hide applied</label>
  </div>
  <ul class="jobs" id="list"></ul>
  <h2>Companies watched</h2>
  <div class="watch" id="watch"></div>
</main>
<script src="profile.js"></script>
<script>
(function(){
  var D=window.PROFILE||{jobs:[],categories:[],watch:[],weak_score:2};
  var KEY="jobtracker_profile_v1";
  var st={cat:"all",applied:{},theme:null};
  try{var s=JSON.parse(localStorage.getItem(KEY)||"{}");for(var k in s)st[k]=s[k];}catch(e){}
  try{var main=JSON.parse(localStorage.getItem("jobtracker_state_v1")||"{}");if(!st.theme)st.theme=main.theme;}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
  function el(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function applyTheme(){
    var t=st.theme;
    if(t!=="dark"&&t!=="light")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
    document.documentElement.setAttribute("data-theme",t);
    el("themeBtn").textContent=t==="dark"?"☾":"☀";
  }
  el("themeBtn").addEventListener("click",function(){
    st.theme=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
    save();applyTheme();
  });
  applyTheme();

  if(D.generated)el("lastScan").textContent="Last scan "+D.generated.replace("T"," ").slice(0,16);
  var labels={};D.categories.forEach(function(c){labels[c.key]=c.label;});
  var today=new Date();today.setHours(0,0,0,0);
  function isNew(j){var d=new Date(j.first_seen+"T00:00:00");return (today-d)/864e5<=3;}

  function visible(cat){
    var q=el("q").value.trim().toLowerCase();
    return D.jobs.filter(function(j){
      if(cat!=="all"&&j.cat!==cat)return false;
      if(!el("weak").checked&&j.score<D.weak_score)return false;
      if(el("newOnly").checked&&!isNew(j))return false;
      if(el("hideApplied").checked&&st.applied[j.url])return false;
      if(q&&(j.title+" "+j.company+" "+j.location).toLowerCase().indexOf(q)<0)return false;
      return true;
    });
  }
  function renderTabs(){
    var keys=["all"].concat(D.categories.map(function(c){return c.key;}));
    el("tabs").innerHTML=keys.map(function(k){
      return '<button data-cat="'+k+'" class="'+(st.cat===k?"on":"")+'">'+esc(k==="all"?"All":labels[k])+
        ' <span class="tct">'+visible(k).length+'</span></button>';
    }).join("");
  }
  function render(){
    renderTabs();
    var js=visible(st.cat);
    el("list").innerHTML=js.length?js.map(function(j){
      var ap=!!st.applied[j.url];
      var meta=[j.company?'<span class="co">'+esc(j.company)+'</span>':"",esc(j.location),j.workload?esc(j.workload)+"%":"",esc(j.source)]
        .filter(Boolean).join(" &middot; ");
      return '<li class="'+(ap?"applied":"")+'"><div class="jt"><a href="'+esc(j.url)+'" target="_blank" rel="noopener">'+esc(j.title)+'</a></div>'+
        '<div class="jm">'+meta+'</div>'+
        '<div class="jr">'+(isNew(j)?'<span class="tag new">New</span>':"")+
        (st.cat==="all"?'<span class="tag">'+esc(labels[j.cat]||j.cat)+'</span>':"")+
        '<span>'+esc(j.posted||j.first_seen)+'</span>'+
        '<button class="apBtn'+(ap?" on":"")+'" data-url="'+esc(j.url)+'">'+(ap?"Applied":"Mark applied")+'</button></div></li>';
    }).join(""):'<li class="empty">No postings match these filters.</li>';
  }
  function renderWatch(){
    el("watch").innerHTML=D.watch.map(function(w){
      var n=w.status==="ok"?w.count+" open":'<span class="bad">failed</span>';
      return '<a href="'+esc(w.url)+'" target="_blank" rel="noopener" title="'+esc(labels[w.cat]||w.cat)+(w.detail?" - "+esc(w.detail):"")+'">'+
        '<span>'+esc(w.name)+'</span><span class="n">'+n+'</span></a>';
    }).join("");
  }
  el("tabs").addEventListener("click",function(e){
    var b=e.target.closest("button[data-cat]");if(!b)return;
    st.cat=b.getAttribute("data-cat");save();render();
  });
  el("list").addEventListener("click",function(e){
    var b=e.target.closest(".apBtn");if(!b)return;
    var u=b.getAttribute("data-url");
    if(st.applied[u])delete st.applied[u];else st.applied[u]=new Date().toISOString().slice(0,10);
    save();render();
  });
  ["q","newOnly","weak","hideApplied"].forEach(function(id){el(id).addEventListener("input",render);});
  render();renderWatch();
})();
</script>
</body>
</html>
